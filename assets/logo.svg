<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e5e3a" />
      <stop offset="100%" stop-color="#27ae60" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27ae60" />
      <stop offset="100%" stop-color="#16a085" />
    </linearGradient>
  </defs>

  <!-- ICONO: Carrito con Hojas de Supermercado El Poblado -->
  <g transform="translate(10, 8)">
    <!-- Marco y Canasta del Carrito -->
    <path d="M 108 14 
             C 105 14, 98 16, 94 22 
             L 86 54 
             L 30 54 
             C 24 54, 21 58, 22 64 
             C 23 70, 27 72, 34 72 
             L 80 72 
             L 76 86 
             L 34 86 
             C 28 86, 24 90, 24 96 
             C 24 102, 28 106, 34 106 
             L 86 106 
             C 91 106, 95 102, 96 97 
             L 110 32 
             L 122 32 
             C 126 32, 129 28, 129 24 
             C 129 18, 126 14, 120 14 
             Z" 
          fill="#24292e" />

    <!-- Swoosh verde exterior envolvente -->
    <path d="M 12 78 
             C 14 62, 32 58, 54 62 
             C 44 68, 30 73, 20 84 
             C 16 82, 13 80, 12 78 Z" 
          fill="url(#swooshGrad)" />

    <!-- Hoja Principal dentro del carrito -->
    <path d="M 40 84 
             C 38 65, 52 44, 76 34 
             C 84 48, 86 66, 74 80 
             C 62 70, 52 64, 44 76 
             C 42 80, 41 83, 40 84 Z" 
          fill="url(#leafGrad)" />

    <!-- Nervadura / Detalle de la hoja -->
    <path d="M 42 82 
             C 50 68, 62 55, 76 42 
             C 68 55, 60 70, 52 83 Z" 
          fill="#a8e6cf" opacity="0.85" />

    <!-- Hoja secundaria pequeña -->
    <path d="M 68 85 
             C 74 78, 85 76, 92 81 
             C 86 88, 77 90, 68 85 Z" 
          fill="#27ae60" />

    <!-- Ruedas del Carrito (Doble anillo concéntrico como en la foto) -->
    <!-- Rueda Izquierda -->
    <g transform="translate(48, 114)">
      <circle cx="0" cy="0" r="11" fill="#24292e" />
      <circle cx="0" cy="0" r="7" fill="#ffffff" />
      <circle cx="0" cy="0" r="3.5" fill="#24292e" />
    </g>
    <!-- Rueda Derecha -->
    <g transform="translate(86, 114)">
      <circle cx="0" cy="0" r="11" fill="#24292e" />
      <circle cx="0" cy="0" r="7" fill="#ffffff" />
      <circle cx="0" cy="0" r="3.5" fill="#24292e" />
    </g>
  </g>

  <!-- TEXTO DEL LOGO: Caligrafía "Supermercado" y tipografía "El Poblado" -->
  <g transform="translate(155, 20)">
    <!-- "Supermercado" en cursiva elegante -->
    <text x="0" y="58" 
          font-family="'Playball', 'Brush Script MT', 'Dancing Script', cursive" 
          font-size="64" 
          fill="#1c2526" 
          font-weight="normal">
      Supermercado
    </text>
    
    <!-- "El Poblado" subtítulo institucional -->
    <text x="5" y="94" 
          font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif" 
          font-size="28" 
          font-weight="800" 
          letter-spacing="4px" 
          fill="#0e5e3a">
      EL POBLADO
    </text>
  </g>
</svg>
